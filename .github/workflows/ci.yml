name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Test native backend
        run: swift test
      - name: Build native backend
        run: swift build
      - name: Build without a graphical backend
        run: swift build --disable-default-traits
      - name: Build examples as a public API client
        run: swift build --package-path Example

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Wayland development libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config
      - name: Show Swift version
        run: swift --version
      - name: Test native backend
        run: swift test
      - name: Build native backend
        run: swift build
      - name: Build without a graphical backend
        run: swift build --disable-default-traits
      - name: Build examples as a public API client
        run: swift build --package-path Example

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust checkout ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Determine changed range
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$EVENT_BASE_SHA" ] && git cat-file -e "$EVENT_BASE_SHA^{commit}" 2>/dev/null; then
            echo "BASE_SHA=$EVENT_BASE_SHA" >> "$GITHUB_ENV"
          else
            echo "BASE_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          fi
      - name: Check whitespace
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"
      - name: Check Swift formatting
        run: |
          mapfile -t swift_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- '*.swift'
          )
          if [ "${#swift_files[@]}" -gt 0 ]; then
            swift format lint --strict "${swift_files[@]}"
          fi
