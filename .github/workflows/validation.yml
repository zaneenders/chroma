name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Swift 6.4 / software OpenGL
    runs-on: ubuntu-24.04
    container: swift:6.4.0-noble
    timeout-minutes: 45
    env:
      CHROMA_BUILD_JOBS: '2'
      PKG_CONFIG_PATH: /opt/chroma-wayland/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/chroma-wayland/lib
      LIBGL_ALWAYS_SOFTWARE: '1'
      EGL_PLATFORM: surfaceless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system build and software-rendering dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl git pkg-config meson ninja-build \
            libffi-dev libexpat1-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgl1-mesa-dri libxkbcommon-dev xkb-data
          bash Scripts/build-ci-wayland.sh /opt/chroma-wayland
      - name: Record runner and toolchain
        shell: bash
        run: |
          mkdir -p validation-results
          cp Package.resolved validation-results/root-dependencies.json
          cp Benchmarks/Package.resolved validation-results/benchmark-dependencies.json
          cp HeadlessModeTests/Package.resolved validation-results/headless-dependencies.json
          { uname -a; cat /etc/os-release; swift --version; lscpu; \
            pkg-config --modversion wayland-client egl glesv2 xkbcommon; \
            printf 'EGL_PLATFORM=%s\nLIBGL_ALWAYS_SOFTWARE=%s\n' "$EGL_PLATFORM" "$LIBGL_ALWAYS_SOFTWARE"; \
            git rev-parse HEAD; git status --short; } > validation-results/environment.txt
      - name: Validate prerequisites and formatting
        shell: bash
        run: |
          bash Scripts/validate.sh preflight 2>&1 | tee validation-results/preflight.log
          bash Scripts/validate.sh format 2>&1 | tee validation-results/format.log
      - name: Root tests (including software OpenGL pixels and resource checks)
        shell: bash
        run: bash Scripts/validate.sh root-tests 2>&1 | tee validation-results/root-tests.log
      - name: Benchmark package tests
        if: ${{ !cancelled() }}
        shell: bash
        run: bash Scripts/validate.sh benchmark-tests 2>&1 | tee validation-results/benchmark-tests.log
      - name: Headless process tests (retain stderr assertions)
        if: ${{ !cancelled() }}
        shell: bash
        run: bash Scripts/validate.sh headless-tests 2>&1 | tee validation-results/headless-tests.log
      - name: Root release build
        if: ${{ !cancelled() }}
        shell: bash
        run: bash Scripts/validate.sh root-release 2>&1 | tee validation-results/root-release.log
      - name: Benchmark release build
        if: ${{ !cancelled() }}
        shell: bash
        run: bash Scripts/validate.sh benchmark-release 2>&1 | tee validation-results/benchmark-release.log
      - name: Headless release build
        if: ${{ !cancelled() }}
        shell: bash
        run: bash Scripts/validate.sh headless-release 2>&1 | tee validation-results/headless-release.log
      - name: Check lockfile drift
        if: ${{ !cancelled() }}
        run: bash Scripts/validate.sh lockfiles
      - name: Collect informational benchmark report
        shell: bash
        run: OPENGL=1 bash Benchmarks/Scripts/run.sh validation-results/benchmarks
      - name: Retain logs and benchmark metadata
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-linux-${{ github.sha }}
          path: validation-results/
          retention-days: 14
          if-no-files-found: warn

  macos:
    name: macOS 27 / Xcode 27 / Metal
    # Public-preview image; do not substitute macos-latest (may run macOS 26).
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      CHROMA_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record runner, toolchain, and graphics availability
        shell: bash
        run: |
          mkdir -p validation-results
          cp Package.resolved validation-results/root-dependencies.json
          cp Benchmarks/Package.resolved validation-results/benchmark-dependencies.json
          cp HeadlessModeTests/Package.resolved validation-results/headless-dependencies.json
          { sw_vers; uname -a; xcodebuild -version; swift --version; \
            system_profiler SPHardwareDataType SPDisplaysDataType; \
            git rev-parse HEAD; git status --short; } > validation-results/environment.txt
      - name: Validate prerequisites and formatting
        shell: bash
        run: |
          bash Scripts/validate.sh preflight 2>&1 | tee validation-results/preflight.log
          bash Scripts/validate.sh format 2>&1 | tee validation-results/format.log
      - name: Root tests (Metal device required, no GPU-test skips)
        shell: bash
        run: bash Scripts/validate.sh root-tests 2>&1 | tee validation-results/root-tests.log
      - name: Benchmark package tests
        if: ${{ !cancelled() }}
        shell: bash
        run: bash Scripts/validate.sh benchmark-tests 2>&1 | tee validation-results/benchmark-tests.log
      - name: Headless process tests (retain stderr assertions)
        if: ${{ !cancelled() }}
        shell: bash
        run: bash Scripts/validate.sh headless-tests 2>&1 | tee validation-results/headless-tests.log
      - name: Root release build
        if: ${{ !cancelled() }}
        shell: bash
        run: bash Scripts/validate.sh root-release 2>&1 | tee validation-results/root-release.log
      - name: Benchmark release build
        if: ${{ !cancelled() }}
        shell: bash
        run: bash Scripts/validate.sh benchmark-release 2>&1 | tee validation-results/benchmark-release.log
      - name: Headless release build
        if: ${{ !cancelled() }}
        shell: bash
        run: bash Scripts/validate.sh headless-release 2>&1 | tee validation-results/headless-release.log
      - name: Check lockfile drift
        if: ${{ !cancelled() }}
        run: bash Scripts/validate.sh lockfiles
      - name: Collect informational benchmark report
        shell: bash
        run: METAL=1 bash Benchmarks/Scripts/run.sh validation-results/benchmarks
      - name: Retain logs and benchmark metadata
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-macos-${{ github.sha }}
          path: validation-results/
          retention-days: 14
          if-no-files-found: warn
